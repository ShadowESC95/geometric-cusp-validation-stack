[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geometric-cusp-validation-stack"
version = "3.1.0"
description = "Multi-backend research stack for amplituhedron/negative-geometry, cusp-residue, emergent-boundary, continuum, quantum and phenomenological validation experiments."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "sympy>=1.12",
  "matplotlib>=3.8",
  "mpmath>=1.3",
  "pandas>=2.0",
]

[project.optional-dependencies]
accel = ["jax>=0.4", "jaxlib>=0.4"]
plotting = ["plotly>=6.0", "pyvista>=0.44", "meshio>=5.3"]
notebook = ["jupyterlab>=4", "ipykernel>=6", "nbformat>=5.10"]
science = ["scikit-learn>=1.4"]
test = ["pytest>=8"]
all = ["jax>=0.4", "jaxlib>=0.4", "plotly>=6.0", "pyvista>=0.44", "meshio>=5.3", "jupyterlab>=4", "ipykernel>=6", "nbformat>=5.10", "scikit-learn>=1.4"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
geocusp-amplituhedron = "geocusp.amplituhedron_cli:main"
geocusp-one-loop = "geocusp.one_loop_cli:main"
geocusp-two-loop = "geocusp.two_loop_cli:main"
geocusp-matrix = "geocusp.matrix_cli:main"
geocusp-continuum = "geocusp.continuum_cli:main"
geocusp-campaign = "geocusp.campaign_cli:main"
geocusp-solver = "geocusp.solver:main"
